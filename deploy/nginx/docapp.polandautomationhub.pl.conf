# DocApp (obieg-rachunkow) — reverse proxy do kontenera na 127.0.0.1:3110
# Wzorowane na istniejących plikach w /etc/nginx/sites-available.
#
# INSTALACJA (jako root):
#   1. sudo cp deploy/nginx/docapp.polandautomationhub.pl.conf /etc/nginx/sites-available/docapp.polandautomationhub.pl
#   2. sudo ln -s /etc/nginx/sites-available/docapp.polandautomationhub.pl /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx          (na tym etapie tylko :80)
#   4. sudo certbot --nginx -d docapp.polandautomationhub.pl
#      (certbot dopisze blok SSL i przekierowanie 80->443)
#
# WAŻNE: X-Forwarded-For jest NADPISYWANY ($remote_addr), nie dopisywany. Aplikacja używa tego adresu do limitów
# logowania i audit logu; dopisywanie pozwoliłoby klientowi podszyć się pod dowolne IP.

server {
  server_name docapp.polandautomationhub.pl;

  # Uploady do 20 MB + narzut multipart
  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:3110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_request_buffering off;   # pliki idą strumieniowo do aplikacji
  }

  # Nagłówki bezpieczeństwa (CSP z nonce ustawia aplikacja)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Dane osobowe: bez treści żądań w logach, tylko standardowy access/error
  access_log /var/log/nginx/docapp_access.log;
  error_log  /var/log/nginx/docapp_error.log;

  listen 80;
}
