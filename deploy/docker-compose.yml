name: obieg-rachunkow

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    <<: *hardening
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      POSTGRES_DB: app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    # postgres wymaga kilku uprawnień przy starcie
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d app"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 1g, cpus: "1.0" } } }

  clamav:
    <<: *hardening
    profiles: ["av"] # wyłączany w wersji testowej (docs/TODO.md); włączany przez COMPOSE_PROFILES=av
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    networks: [internal]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy: { resources: { limits: { memory: 2g, cpus: "1.0" } } }

  migrate:
    <<: *hardening
    image: ${APP_IMAGE:?}-migrate
    build: { context: .., target: migrate }
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    environment:
      MIGRATION_DATABASE_URL: postgres://migrator:${MIGRATOR_DB_PASSWORD}@db:5432/app
      APP_URL: ${APP_URL:?}
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  app:
    <<: *hardening
    image: ${APP_IMAGE:?}
    build: { context: .., target: app }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, "/app/.next/cache"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://app:${APP_DB_PASSWORD}@db:5432/app
      STORAGE_LOCAL_PATH: /data/files
    volumes:
      - files_data:/data/files
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      clamav: { condition: service_healthy, required: false }
      mailpit: { condition: service_started, required: false }
    networks: [internal, web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy: { resources: { limits: { memory: 1g, cpus: "1.0" } } }

  caddy:
    <<: *hardening
    profiles: ["caddy"] # wyłączany, gdy przed aplikacją stoi nginx hosta (--proxy nginx)
    image: caddy:2.10-alpine
    restart: unless-stopped
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    networks: [web]
    deploy: { resources: { limits: { memory: 256m, cpus: "0.5" } } }

  mailpit:
    <<: *hardening
    profiles: ["mailpit"] # tylko instalacje testowe/demo: przechwytuje maile, nic nie wychodzi na zewnątrz
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"] # podgląd przez tunel SSH
    networks: [internal, web]
    deploy: { resources: { limits: { memory: 128m, cpus: "0.25" } } }

  backup:
    <<: *hardening
    image: ${APP_IMAGE:?}-backup
    build: { context: ../backup }
    restart: unless-stopped
    env_file: [.env]
    environment:
      PGHOST: db
      PGUSER: dbadmin
      PGDATABASE: app
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      TZ: Europe/Warsaw
    volumes:
      - files_data:/data/files:ro
      - backup_cache:/cache
      - ${BACKUP_DISK_PATH:-/mnt/backup}:/backup-disk
    depends_on:
      db: { condition: service_healthy }
    cap_add: [DAC_READ_SEARCH]
    networks: [internal, web] # web: wyjście do S3 off-site
    deploy: { resources: { limits: { memory: 512m, cpus: "0.5" } } }

volumes:
  db_data:
  files_data:
  caddy_data:
  caddy_config:
  clamav_db:
  backup_cache:

networks:
  # internal: bez dostępu do internetu i bez portów na hoście (Postgres, ClamAV)
  internal: { internal: true }
  web: {}
